<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重點總複習｜首頁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0b1020;
            --surface: rgba(255, 255, 255, 0.06);
            --surface-strong: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.12);
            --text: #eef2ff;
            --text2: #b8c0d9;
            --text3: #7c86a3;
            --blue: #4d7cfe;
            --cyan: #22d3ee;
            --violet: #a78bfa;
            --pink: #f472b6;
            --green: #34d399;
            --amber: #fbbf24;
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.45);
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 動態背景 ===== */
        .bg-fx { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
        .bg-fx::after {
            content: '';
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 75%);
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .5;
            animation: drift 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 480px; height: 480px; background: #1d4ed8; top: -120px; left: -100px; }
        .orb-2 { width: 420px; height: 420px; background: #7c3aed; top: 10%; right: -140px; animation-delay: -6s; animation-duration: 22s; }
        .orb-3 { width: 380px; height: 380px; background: #0e7490; bottom: -120px; left: 30%; animation-delay: -12s; animation-duration: 26s; }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(60px, 40px) scale(1.15); }
        }
        #stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

        /* ===== Hero ===== */
        header {
            text-align: center;
            padding: 4.5rem 1.5rem 2.5rem;
            position: relative;
        }
        .badge-row {
            display: inline-flex; align-items: center; gap: .5rem;
            padding: .35rem .9rem; margin-bottom: 1.2rem;
            border: 1px solid var(--border); border-radius: 999px;
            background: var(--surface);
            font-size: .8rem; color: var(--text2);
            backdrop-filter: blur(8px);
            animation: fadeUp .7s ease both;
        }
        .badge-row .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 10px var(--green);
            animation: pulse 1.6s ease infinite;
        }
        @keyframes pulse { 50% { opacity: .35; } }
        header h1 {
            font-size: clamp(2rem, 5.5vw, 3.2rem);
            font-weight: 900;
            letter-spacing: -.04em;
            line-height: 1.15;
            margin-bottom: .8rem;
            animation: fadeUp .7s .1s ease both;
        }
        .gradient-text {
            background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet), var(--pink));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 6s linear infinite;
        }
        @keyframes gradientShift { to { background-position: 300% 0; } }
        header p {
            font-size: 1.05rem; color: var(--text2);
            max-width: 560px; margin: 0 auto;
            animation: fadeUp .7s .2s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        main {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 4rem;
        }
        .section-label {
            font-size: .78rem; font-weight: 700;
            letter-spacing: .12em; color: var(--text3);
            text-transform: uppercase;
            margin-bottom: 1.1rem;
            display: flex; align-items: center; gap: .7rem;
            animation: fadeUp .7s .3s ease both;
        }
        .section-label::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.4rem;
        }

        /* ===== 玻璃卡片 ===== */
        .subject-card {
            --c1: var(--blue);
            --c2: var(--violet);
            display: block;
            position: relative;
            border-radius: 18px;
            padding: 1.6rem 1.5rem 1.4rem;
            text-decoration: none;
            color: inherit;
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            overflow: hidden;
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
            animation: fadeUp .7s ease both;
        }
        .subject-card:nth-child(1) { animation-delay: .35s; }
        .subject-card:nth-child(2) { animation-delay: .45s; }
        .subject-card:nth-child(3) { animation-delay: .55s; }
        .subject-card::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(500px circle at var(--mx, 50%) var(--my, 0%),
                color-mix(in srgb, var(--c1) 22%, transparent), transparent 45%);
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
        }
        .subject-card::after {
            content: '';
            position: absolute; top: 0; left: -80%;
            width: 55%; height: 100%;
            background: linear-gradient(105deg, transparent, rgba(255,255,255,.14), transparent);
            transform: skewX(-20deg);
            transition: left .55s ease;
            pointer-events: none;
        }
        .subject-card:hover {
            transform: translateY(-6px);
            border-color: color-mix(in srgb, var(--c1) 55%, transparent);
            box-shadow: 0 18px 44px color-mix(in srgb, var(--c1) 25%, rgba(0,0,0,.5));
        }
        .subject-card:hover::before { opacity: 1; }
        .subject-card:hover::after { left: 130%; }
        .subject-card:focus-visible { outline: 2px solid var(--c1); outline-offset: 3px; }

        .card-icon {
            width: 56px; height: 56px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.7rem;
            border-radius: 14px;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--c1), var(--c2));
            box-shadow: 0 8px 22px color-mix(in srgb, var(--c1) 40%, transparent);
        }
        .subject-card h2 {
            font-size: 1.3rem; font-weight: 800;
            letter-spacing: -.02em; margin-bottom: .4rem;
        }
        .subject-card p { font-size: .88rem; color: var(--text2); margin-bottom: 1.1rem; }
        .card-footer {
            display: flex; align-items: center; justify-content: space-between;
            gap: .5rem; flex-wrap: wrap;
        }
        .meta { display: flex; flex-wrap: wrap; gap: .4rem; }
        .tag {
            font-size: .73rem; font-weight: 600;
            padding: .22rem .65rem; border-radius: 999px;
            background: rgba(255,255,255,.07);
            border: 1px solid var(--border);
            color: var(--text2);
        }
        .tag.live {
            background: color-mix(in srgb, var(--green) 18%, transparent);
            border-color: color-mix(in srgb, var(--green) 45%, transparent);
            color: #6ee7b7;
        }
        .tag.soon {
            color: var(--text3);
        }
        .enter {
            font-size: .82rem; font-weight: 700;
            color: color-mix(in srgb, var(--c1) 75%, #fff);
            display: inline-flex; align-items: center; gap: .3rem;
            transition: gap .2s;
        }
        .subject-card:hover .enter { gap: .6rem; }

        .stats {
            display: flex; flex-wrap: wrap; gap: .8rem;
            margin: 2.2rem 0 0;
            animation: fadeUp .7s .55s ease both;
        }
        .stat {
            flex: 1 1 160px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem 1.2rem;
            backdrop-filter: blur(8px);
        }
        .stat b {
            display: block; font-size: 1.5rem; font-weight: 900;
            background: linear-gradient(90deg, var(--cyan), var(--blue));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .stat span { font-size: .8rem; color: var(--text3); }

        footer {
            text-align: center;
            padding: 1.4rem;
            font-size: .8rem;
            color: var(--text3);
            border-top: 1px solid var(--border);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
        @media (max-width: 480px) {
            header { padding: 3.2rem 1.2rem 2rem; }
        }
    </style>
</head>
<body>

    <div class="bg-fx">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <canvas id="stars"></canvas>

    <header>
        <div class="badge-row"><span class="dot"></span> 考前重點・互動工具・隨點隨複習</div>
        <h1>📘 重點總複習<br><span class="gradient-text">Study Hub</span></h1>
        <p>各科目的考前重點整理與互動式小工具。挑一張卡片，開始今天的複習。</p>
    </header>

    <main>
        <div class="section-label">科目總覽</div>
        <div class="subject-grid">

            <a class="subject-card" href="learning_website.html" style="--c1: #4d7cfe; --c2: #22d3ee;">
                <div class="card-icon">🌐</div>
                <h2>網路概論</h2>
                <p>IPv4/IPv6 標頭、封包解析實戰、子網路切割、DNS 遞迴與反覆查詢，還有互動式封包分割模擬器。</p>
                <div class="card-footer">
                    <div class="meta">
                        <span class="tag live">● 已上線</span>
                        <span class="tag">期中考</span>
                        <span class="tag">期末考</span>
                    </div>
                    <span class="enter">進入 →</span>
                </div>
            </a>

            <a class="subject-card" href="database.html" style="--c1: #a78bfa; --c2: #f472b6;">
                <div class="card-icon">🗄️</div>
                <h2>資料庫系統管理</h2>
                <p>SQL 指令、正規化、ER Model、交易與 ACID、索引與效能——重點持續整理中。</p>
                <div class="card-footer">
                    <div class="meta">
                        <span class="tag live">● 已加入</span>
                        <span class="tag soon">內容建置中</span>
                    </div>
                    <span class="enter">進入 →</span>
                </div>
            </a>

        </div>

        <div class="stats">
            <div class="stat"><b id="stat-subjects">2</b><span>科目</span></div>
            <div class="stat"><b>10+</b><span>期中期末大題</span></div>
            <div class="stat"><b>3</b><span>互動模擬器</span></div>
            <div class="stat"><b>∞</b><span>持續增加中</span></div>
        </div>
    </main>

    <footer>重點總複習 · Study Hub</footer>

    <script>
        // 星空粒子背景
        (function () {
            const canvas = document.getElementById('stars');
            const ctx = canvas.getContext('2d');
            let w, h, stars = [];
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
                const count = Math.min(120, Math.floor(w * h / 16000));
                stars = Array.from({ length: count }, () => ({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.4 + 0.3,
                    a: Math.random(),
                    s: Math.random() * 0.02 + 0.004,
                    vy: Math.random() * 0.25 + 0.05
                }));
            }
            function draw() {
                ctx.clearRect(0, 0, w, h);
                for (const st of stars) {
                    st.a += st.s;
                    const alpha = 0.35 + Math.abs(Math.sin(st.a)) * 0.55;
                    ctx.beginPath();
                    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(190, 210, 255,' + alpha + ')';
                    ctx.fill();
                    st.y += st.vy;
                    if (st.y > h) { st.y = 0; st.x = Math.random() * w; }
                }
                requestAnimationFrame(draw);
            }
            window.addEventListener('resize', resize);
            resize();
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) draw();
        })();

        // 滑鼠追蹤光暈
        document.querySelectorAll('.subject-card').forEach(card => {
            card.addEventListener('pointermove', e => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
                card.style.setProperty('--my', (e.clientY - rect.top) + 'px');
            });
        });
    </script>

</body>
</html>
