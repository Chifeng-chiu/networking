<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重點總複習｜首頁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f0f2f5;
            --surface: #fff;
            --surface2: #f8f9fa;
            --border: #dee2e6;
            --text: #212529;
            --text2: #495057;
            --text3: #868e96;
            --primary: #4263eb;
            --primary-light: #dbe4ff;
            --primary-dark: #3b5bdb;
            --danger: #e03131;
            --danger-light: #ffe0e0;
            --radius: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,.1);
            --shadow-lg: 0 8px 24px rgba(0,0,0,.12);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1c7ed6, #4263eb, #7048e8);
            color: #fff;
            padding: 3rem 1.5rem 2.2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        header::after {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,.12) 0%, transparent 60%);
        }
        header > * { position: relative; z-index: 1; }
        header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; margin-bottom: .4rem; }
        header p { font-size: 1rem; opacity: .85; max-width: 560px; margin: 0 auto; }

        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 3rem;
        }

        .section-label {
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .08em;
            color: var(--text3);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .subject-card {
            display: block;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow);
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
            position: relative;
            overflow: hidden;
        }
        .subject-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 5px;
            background: var(--card-color, var(--primary));
        }
        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--card-color, var(--primary));
        }
        .subject-card:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }
        .subject-card .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: .6rem;
        }
        .subject-card h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: .35rem;
            color: var(--text);
        }
        .subject-card p {
            font-size: .88rem;
            color: var(--text2);
            margin-bottom: 1rem;
        }
        .subject-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
        }
        .tag {
            font-size: .75rem;
            font-weight: 600;
            padding: .2rem .6rem;
            border-radius: 999px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text2);
        }
        .tag.live {
            background: #d3f9d8;
            border-color: #b2f2bb;
            color: #2b8a3e;
        }
        .tag.soon {
            background: var(--surface2);
            border-color: var(--border);
            color: var(--text3);
        }

        .subject-card.coming {
            opacity: .65;
            cursor: default;
            pointer-events: none;
            filter: grayscale(.4);
        }
        .subject-card.coming::before { background: #adb5bd; }
        .subject-card.coming:hover {
            transform: none;
            box-shadow: var(--shadow);
            border-color: var(--border);
        }

        .add-hint {
            background: var(--surface);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            color: var(--text3);
            font-size: .9rem;
        }
        .add-hint strong { color: var(--text2); }

        footer {
            text-align: center;
            padding: 1.25rem;
            font-size: .8rem;
            color: var(--text3);
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        @media (max-width: 480px) {
            header h1 { font-size: 1.6rem; }
            main { padding: 1.5rem 1rem 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📘 重點總複習</h1>
        <p>各科目的考前重點整理與互動式小工具，點卡片進入對應科目。</p>
    </header>

    <main>
        <div class="section-label">科目總覽</div>
        <div class="subject-grid">

            <a class="subject-card" href="learning_website.html" style="--card-color: #4263eb;">
                <span class="icon">🌐</span>
                <h2>網路概論</h2>
                <p>IPv4/IPv6 標頭、封包解析實戰、子網路切割、DNS 遞迴與反覆查詢、114/115 期中期末重點。</p>
                <div class="meta">
                    <span class="tag live">✅ 已上線</span>
                    <span class="tag">期中考</span>
                    <span class="tag">期末考</span>
                    <span class="tag">互動模擬器</span>
                </div>
            </a>

            <div class="subject-card coming">
                <span class="icon">💻</span>
                <h2>程式設計</h2>
                <p>（預留位置）未來新增其他科目時，在這裡加入連結卡片。</p>
                <div class="meta">
                    <span class="tag soon">敬請期待</span>
                </div>
            </div>

            <div class="subject-card coming">
                <span class="icon">🗄️</span>
                <h2>資料庫</h2>
                <p>（預留位置）未來新增其他科目時，在這裡加入連結卡片。</p>
                <div class="meta">
                    <span class="tag soon">敬請期待</span>
                </div>
            </div>

            <div class="add-hint">
                ➕ 新科目很簡單：複製一張 <strong>&lt;a class="subject-card"&gt;</strong> 卡片、改連結與內容即可。
            </div>
        </div>
    </main>

    <footer>重點總複習 · 學習資源整理</footer>

</body>
</html>
